<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="순찰일지">
  <!--
    화면의 사진 칸 표식과 같은 그림. 여기서는 색을 값으로 박는다 —
    아이콘 파일은 CSS 변수를 못 읽고, 탭 표시줄이 밝든 어둡든 같아야 한다.
    그래서 바탕을 흰 사각형으로 깔고 그 위에 그린다.
  -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />
  <g transform="translate(76 76) scale(6)" fill="none">
    <!-- 몸통 — 각진 상자가 아니라 둥글고 도톰하게. -->
    <path
      d="M10 20c0-3.3 2.7-6 6-6h3.2c1.1 0 2.1-.6 2.6-1.5l1-1.8c.5-.9 1.5-1.5 2.6-1.5h5.2c1.1 0 2.1.6 2.6 1.5l1 1.8c.5.9 1.5 1.5 2.6 1.5H40c3.3 0 6 2.7 6 6v15c0 3.3-2.7 6-6 6H16c-3.3 0-6-2.7-6-6V20Z"
      fill="#F9871F"
      stroke="#0c0d10"
      stroke-width="2.6"
      stroke-linejoin="round"
    />

    <!-- 렌즈 -->
    <circle cx="28" cy="28" r="8.4" fill="#ffffff" stroke="#0c0d10" stroke-width="2.6" />
    <circle cx="24.8" cy="24.8" r="1.9" fill="#0c0d10" opacity="0.85" />

    <!-- 플래시 -->
    <circle cx="40" cy="20.5" r="1.7" fill="#0c0d10" />

    <!-- 눌렀다는 기척. -->
    <path d="M5.5 16.5 3 13M50.5 16.5 53 13" stroke="#F9871F" stroke-width="2.4" stroke-linecap="round" />
  </g>
</svg>
