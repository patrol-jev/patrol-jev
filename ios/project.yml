name: Patrol
options:
  bundleIdPrefix: kr.ai.patrol
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Manual
    # 아이폰 전용. 아이패드에서는 아이폰 크기로 돈다.
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Patrol:
    type: application
    platform: iOS
    sources:
      - Patrol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.ai.patrol
        INFOPLIST_FILE: Patrol/Info.plist
        CODE_SIGN_ENTITLEMENTS: Patrol/Patrol.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore kr.ai.patrol"
        CODE_SIGN_IDENTITY: "Apple Distribution"
    dependencies:
      - target: PatrolWidgetExtension

  PatrolWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - PatrolWidget
      - path: Patrol/Shared
        name: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.ai.patrol.widget
        INFOPLIST_FILE: PatrolWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PatrolWidget/PatrolWidget.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore kr.ai.patrol.widget"
        CODE_SIGN_IDENTITY: "Apple Distribution"

schemes:
  Patrol:
    build:
      targets:
        Patrol: all
        PatrolWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
