name: iOS

# 밀 때는 서명 없이 빌드만 본다(비밀값을 쓰지 않는다).
# 서명 빌드와 TestFlight 올리기는 손으로 눌러야 돈다.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'compile: 서명 없이 빌드만 / build: 서명 빌드 / testflight: 올리기'
        required: true
        default: compile
        type: choice
        options:
          - compile
          - build
          - testflight

permissions:
  contents: read

jobs:
  compile:
    if: github.event_name == 'push' || inputs.mode == 'compile'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    env:
      APPLE_TEAM_ID: ''

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator without signing
        run: |
          xcodebuild build \
            -project Patrol.xcodeproj \
            -scheme Patrol \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

  signed:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'compile'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Decode API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          echo "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Select newest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Signed build
        if: inputs.mode == 'build'
        run: bundle exec fastlane build_only

      - name: Build and upload to TestFlight
        if: inputs.mode == 'testflight'
        run: bundle exec fastlane beta

      # 공개 저장소다. 만든 ipa 를 실행 기록에 올려 두지 않는다.
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
